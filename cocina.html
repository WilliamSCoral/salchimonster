<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍳 Cocina — Salchimonster</title>
<style>
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --card: #0f3460;
    --accent: #e94560;
    --green: #00b894;
    --yellow: #fdcb6e;
    --text: #f0f0f0;
    --gray: #a0aec0;
    --border: #2d3561;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* ─── LOGIN ─── */
  #login-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 30px;
    gap: 14px;
  }
  .login-logo { font-size: 3rem; margin-bottom: 4px; }
  .login-title { font-size: 1.4rem; font-weight: 800; }
  .login-sub { font-size: 0.85rem; color: var(--gray); }
  .login-box {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    padding: 24px 28px;
    width: 100%;
    max-width: 340px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 8px;
  }
  .login-label { font-size: 0.78rem; color: var(--gray); font-weight: 600; margin-bottom: 2px; }
  .login-input {
    width: 100%;
    padding: 11px 14px;
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.2s;
  }
  .login-input:focus { border-color: var(--accent); }
  .btn-login {
    width: 100%;
    padding: 13px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    margin-top: 4px;
    transition: opacity 0.2s;
  }
  .btn-login:hover { opacity: 0.85; }
  .login-error { color: var(--accent); font-size: 0.82rem; font-weight: 600; text-align: center; }

  /* ─── HEADER ─── */
  header {
    background: var(--surface);
    border-bottom: 2px solid var(--accent);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-logo { font-size: 1.3rem; font-weight: 900; }
  .header-logo span { color: var(--accent); }
  .header-user { font-size: 0.75rem; color: var(--gray); margin-top: 2px; }
  .badge-count {
    background: var(--accent);
    color: #fff;
    font-weight: 800;
    font-size: 0.88rem;
    padding: 4px 12px;
    border-radius: 20px;
    min-width: 36px;
    text-align: center;
    transition: transform 0.2s;
  }
  .badge-count.pulse { animation: pulse 0.4s ease; }
  @keyframes pulse { 0%{transform:scale(1)} 50%{transform:scale(1.3)} 100%{transform:scale(1)} }
  #reloj { font-size: 1.05rem; font-weight: 700; color: var(--yellow); }
  .btn-logout {
    background: none;
    border: 1px solid var(--border);
    color: var(--gray);
    padding: 5px 12px;
    border-radius: 8px;
    font-size: 0.78rem;
    cursor: pointer;
  }
  .btn-logout:hover { border-color: var(--accent); color: var(--accent); }

  /* ─── GRID ─── */
  #main-screen { display: none; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
    padding: 20px;
  }

  /* ─── CARD ─── */
  .card {
    background: var(--card);
    border: 2px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    position: relative;
    overflow: hidden;
    touch-action: pan-y;
    user-select: none;
    animation: slideIn 0.35s ease;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  @keyframes slideIn { from{opacity:0;transform:translateY(-18px)} to{opacity:1;transform:translateY(0)} }
  .card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
  .card.swiping { transition: none; }
  .card.dispatching {
    animation: dispatchOut 0.45s ease forwards;
    pointer-events: none;
  }
  @keyframes dispatchOut {
    0%   { opacity:1; transform:translateX(0) scale(1); }
    100% { opacity:0; transform:translateX(140%) scale(0.88); }
  }

  .timer-bar {
    position: absolute;
    top: 0; left: 0; right: 0; height: 4px;
    background: var(--green);
    border-radius: 16px 16px 0 0;
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 10px;
    margin-top: 6px;
  }
  .mesa-badge {
    background: var(--accent);
    color: #fff;
    font-weight: 900;
    font-size: 1.1rem;
    padding: 4px 14px;
    border-radius: 8px;
  }
  .hora-badge {
    font-size: 0.78rem;
    color: var(--yellow);
    font-weight: 700;
    background: rgba(253,203,110,0.12);
    padding: 4px 10px;
    border-radius: 8px;
  }
  .mesero-tag { font-size: 0.72rem; color: var(--gray); margin-bottom: 10px; }

  .items-list { margin-bottom: 14px; }
  .item-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 4px;
    border-bottom: 1px solid var(--border);
    font-size: 0.92rem;
    cursor: pointer;
    border-radius: 6px;
    transition: background 0.15s;
  }
  .item-row:last-child { border-bottom: none; }
  .item-row:hover { background: rgba(255,255,255,0.04); }
  .item-row.done { opacity: 0.45; }
  .item-row.done .item-nombre { text-decoration: line-through; }
  .item-row.done .item-cant { background: var(--green); }
  .item-cant {
    background: var(--accent);
    color: #fff;
    font-weight: 800;
    font-size: 0.85rem;
    min-width: 28px; height: 28px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background 0.2s;
  }
  .item-nombre { flex: 1; font-weight: 600; }
  .item-check {
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 2px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    font-size: 0.85rem;
    transition: all 0.2s;
  }
  .item-row.done .item-check {
    background: var(--green);
    border-color: var(--green);
  }

  .btn-despachar {
    width: 100%;
    padding: 13px;
    background: #2d3561;
    color: var(--gray);
    border: 2px solid var(--border);
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 800;
    cursor: pointer;
    transition: all 0.25s;
  }
  .btn-despachar.listo {
    background: var(--green);
    color: #fff;
    border-color: var(--green);
    animation: pulse-btn 0.6s ease;
  }
  @keyframes pulse-btn { 0%{transform:scale(1)} 50%{transform:scale(1.03)} 100%{transform:scale(1)} }
  .btn-despachar:hover { opacity: 0.88; }
  .btn-despachar:active { transform: scale(0.97); }
  .swipe-hint { text-align: center; font-size: 0.7rem; color: var(--gray); margin-top: 7px; }

  /* ─── EMPTY ─── */
  #empty-state {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    padding: 80px 20px;
    text-align: center;
  }
  .empty-icon { font-size: 4rem; }
  .empty-title { font-size: 1.4rem; font-weight: 800; color: var(--green); }
  .empty-sub { font-size: 0.88rem; color: var(--gray); max-width: 260px; }

  /* ─── TOAST ─── */
  #toast {
    position: fixed;
    bottom: 28px; right: 24px;
    background: var(--green);
    color: #fff;
    font-weight: 700;
    padding: 11px 20px;
    border-radius: 12px;
    font-size: 0.9rem;
    opacity: 0;
    transform: translateY(16px);
    transition: all 0.3s;
    pointer-events: none;
    z-index: 999;
  }
  #toast.show { opacity: 1; transform: translateY(0); }

  /* ─── AUDIO UNLOCK ─── */
  #audio-unlock {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 200;
    align-items: center; justify-content: center;
    flex-direction: column; gap: 20px; text-align: center; padding: 30px;
  }
  #audio-unlock.show { display: flex; }
  .au-btn {
    background: var(--green); color: #fff; border: none;
    padding: 16px 36px; border-radius: 14px;
    font-size: 1.1rem; font-weight: 800; cursor: pointer;
  }

  @media (max-width: 480px) {
    .grid { grid-template-columns: 1fr; padding: 12px; }
  }
</style>
</head>
<body>

<!-- ─── AUDIO UNLOCK ─── -->
<div id="audio-unlock">
  <div style="font-size:2.5rem">🔔</div>
  <div style="font-size:1.1rem;font-weight:800">Activar alertas de sonido</div>
  <div style="font-size:0.82rem;color:var(--gray)">Toca para recibir sonido cuando llegue un pedido nuevo</div>
  <button class="au-btn" onclick="unlockAudio()">✅ Activar y entrar</button>
</div>

<!-- ─── LOGIN ─── -->
<div id="login-screen">
  <div class="login-logo">🍳</div>
  <div class="login-title">Cocina — Salchimonster</div>
  <div class="login-sub">Ingresa con tu usuario de cocina</div>
  <div class="login-box">
    <div>
      <div class="login-label">Usuario</div>
      <input class="login-input" id="l-user" type="text" placeholder="tu_usuario" autocomplete="username" inputmode="text">
    </div>
    <div>
      <div class="login-label">Contraseña</div>
      <input class="login-input" id="l-pass" type="password" placeholder="••••••" autocomplete="current-password">
    </div>
    <button class="btn-login" id="btn-login" onclick="doLogin()">Entrar</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- ─── MAIN ─── -->
<div id="main-screen">
  <header>
    <div>
      <div class="header-logo">🍳 <span>Cocina</span></div>
      <div class="header-user" id="header-user"></div>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <div id="reloj">--:--</div>
      <div class="badge-count" id="badge-count">0</div>
      <button class="btn-logout" onclick="doLogout()">Salir</button>
    </div>
  </header>

  <div id="empty-state">
    <div class="empty-icon">✅</div>
    <div class="empty-title">Todo despachado</div>
    <div class="empty-sub">No hay pedidos pendientes. Aparecerán aquí en cuanto lleguen.</div>
  </div>
  <div class="grid" id="pedidos-grid"></div>
</div>

<!-- ─── TOAST ─── -->
<div id="toast"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyD0oZ1f7JpoaTrJDzby5W5XlHh1Q-hSGfk",
  authDomain: "facturas-salchimonster.firebaseapp.com",
  projectId: "facturas-salchimonster",
  storageBucket: "facturas-salchimonster.firebasestorage.app",
  messagingSenderId: "935498177561",
  appId: "1:935498177561:web:ed721d74018f5577b05e88"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db   = firebase.firestore();

// ══════════════════════════════════════
//   RELOJ
// ══════════════════════════════════════
function tickReloj() {
  const n = new Date();
  document.getElementById('reloj').textContent =
    n.getHours().toString().padStart(2,'0') + ':' +
    n.getMinutes().toString().padStart(2,'0');
}
tickReloj();
setInterval(tickReloj, 10000);

// ══════════════════════════════════════
//   AUDIO
// ══════════════════════════════════════
let audioCtx = null;

function crearBeep() {
  if(!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, audioCtx.currentTime);
    osc.frequency.setValueAtTime(660, audioCtx.currentTime + 0.15);
    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + 0.5);
  } catch(e) {}
}

function unlockAudio() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  crearBeep();
  document.getElementById('audio-unlock').classList.remove('show');
}

// ══════════════════════════════════════
//   LOGIN
// ══════════════════════════════════════
async function doLogin() {
  const username = document.getElementById('l-user').value.trim().toLowerCase();
  const pass     = document.getElementById('l-pass').value;
  const errEl    = document.getElementById('login-error');
  const btn      = document.getElementById('btn-login');
  errEl.textContent = '';
  if(!username || !pass) { errEl.textContent = 'Ingresa usuario y contraseña.'; return; }
  btn.disabled = true; btn.textContent = 'Ingresando...';
  try {
    const email = username + '@salchimonster.app';
    await auth.signInWithEmailAndPassword(email, pass);
    // onAuthStateChanged se encarga del resto
  } catch(e) {
    errEl.textContent = 'Usuario o contraseña incorrectos.';
    btn.disabled = false; btn.textContent = 'Entrar';
  }
}

async function doLogout() {
  kitchenUnsub && kitchenUnsub();
  await auth.signOut();
}

document.getElementById('l-pass').addEventListener('keydown', e => {
  if(e.key === 'Enter') doLogin();
});

// ══════════════════════════════════════
//   AUTH STATE
// ══════════════════════════════════════
let kitchenUnsub = null;

auth.onAuthStateChanged(async user => {
  if(!user) {
    // Mostrar login, ocultar app
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('main-screen').style.display  = 'none';
    document.getElementById('btn-login').disabled = false;
    document.getElementById('btn-login').textContent = 'Entrar';
    kitchenUnsub && kitchenUnsub();
    kitchenUnsub = null;
    return;
  }

  // Verificar rol
  try {
    const doc = await db.collection('usuarios').doc(user.uid).get();
    if(!doc.exists) { await auth.signOut(); return; }
    const role  = doc.data().role || 'mesero';
    const nombre = doc.data().nombre || user.email.split('@')[0];

    if(role !== 'cocina' && role !== 'admin') {
      document.getElementById('login-error').textContent = '⛔ Tu usuario no tiene acceso a la cocina.';
      document.getElementById('btn-login').disabled = false;
      document.getElementById('btn-login').textContent = 'Entrar';
      await auth.signOut();
      return;
    }

    // Acceso concedido
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('main-screen').style.display  = 'block';
    document.getElementById('header-user').textContent    = '👤 ' + nombre;

    // Audio mobile
    if(/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
      document.getElementById('audio-unlock').classList.add('show');
    } else {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
    }

    initKitchen();
  } catch(e) {
    document.getElementById('login-error').textContent = 'Error al verificar rol: ' + e.message;
    await auth.signOut();
  }
});

// ══════════════════════════════════════
//   KITCHEN LISTENER
// ══════════════════════════════════════
let pedidosActivos = {};
let primeraVez = true;

function initKitchen() {
  if(kitchenUnsub) kitchenUnsub();
  primeraVez = true;
  pedidosActivos = {};
  document.getElementById('pedidos-grid').innerHTML = '';

  // Sin orderBy para evitar requerir índice compuesto — ordenamos en cliente
  kitchenUnsub = db.collection('pedidos_cocina')
    .where('estado', '==', 'pendiente')
    .onSnapshot(snap => {
      const nuevosIds = new Set(snap.docs.map(d => d.id));
      const hayNuevo  = !primeraVez && snap.docs.some(d => !pedidosActivos[d.id]);
      primeraVez = false;

      // Eliminar cards despachados
      Object.keys(pedidosActivos).forEach(id => {
        if(!nuevosIds.has(id)) {
          const card = document.getElementById('card-'+id);
          if(card) { card.classList.add('dispatching'); setTimeout(()=>card.remove(), 460); }
          delete pedidosActivos[id];
        }
      });

      // Ordenar por creadoAt ascendente en el cliente
      const docsOrdenados = [...snap.docs].sort((a, b) => {
        const ta = a.data().creadoAt?.toMillis?.() ?? 0;
        const tb = b.data().creadoAt?.toMillis?.() ?? 0;
        return ta - tb;
      });

      // Agregar nuevos o actualizar existentes (en orden)
      docsOrdenados.forEach(doc => {
        if(!pedidosActivos[doc.id]) {
          pedidosActivos[doc.id] = doc.data();
          renderCard(doc.id, doc.data());
        } else {
          // Detectar si cambiaron los items y actualizar el card
          const oldStr = JSON.stringify(pedidosActivos[doc.id].items || []);
          const newStr = JSON.stringify(doc.data().items || []);
          if(oldStr !== newStr) {
            pedidosActivos[doc.id] = doc.data();
            updateCardItems(doc.id, doc.data());
          }
        }
      });

      // Badge
      const count = snap.docs.length;
      const badge = document.getElementById('badge-count');
      badge.textContent = count;
      if(hayNuevo) {
        badge.classList.add('pulse');
        setTimeout(()=>badge.classList.remove('pulse'), 500);
        crearBeep();
        showToast('🍽️ ¡Nuevo pedido!');
      }

      // Empty state
      document.getElementById('empty-state').style.display  = count === 0 ? 'flex' : 'none';
      document.getElementById('pedidos-grid').style.display = count === 0 ? 'none' : 'grid';
    }, err => {
      console.error('Kitchen listener error:', err);
      showToast('❌ Error de conexión: ' + err.message);
    });
}

// ══════════════════════════════════════
//   RENDER CARD
// ══════════════════════════════════════
function renderCard(docId, data) {
  const grid = document.getElementById('pedidos-grid');
  const card = document.createElement('div');
  card.className = 'card';
  card.id = 'card-' + docId;

  const creadoAt = data.creadoAt
    ? (data.creadoAt.toDate ? data.creadoAt.toDate() : new Date(data.creadoAt))
    : new Date();

  const items = data.items || [];
  // Expandir cada ítem en filas individuales por unidad
  const filas = [];
  items.forEach(it => {
    for(let u = 0; u < (it.cantidad || 1); u++) {
      filas.push({ nombre: it.nombre });
    }
  });
  const total = filas.length;
  const itemsHtml = filas.map((fila, idx) => `
    <div class="item-row" id="item-${docId}-${idx}" onclick="toggleItem('${docId}', ${idx}, ${total})">
      <div class="item-cant">1</div>
      <div class="item-nombre">${fila.nombre}</div>
      <div class="item-check"></div>
    </div>`).join('');

  card.innerHTML = `
    <div class="timer-bar" id="bar-${docId}"></div>
    <div class="card-header">
      <div class="mesa-badge">Mesa ${data.mesa || '—'}</div>
      <div class="hora-badge">⏰ ${data.hora || '--:--'}</div>
    </div>
    ${data.mesero ? `<div class="mesero-tag">👤 ${data.mesero}</div>` : ''}
    <div class="items-list">${itemsHtml}</div>
    <button class="btn-despachar" id="btn-desp-${docId}" onclick="despachar('${docId}')">
      Marcar ítems para despachar
    </button>
    <div class="swipe-hint">← desliza para despachar todo →</div>
  `;

  grid.appendChild(card);
  initTimerBar(docId, creadoAt);
  initSwipe(card, docId);
}

function updateCardItems(docId, data) {
  const card = document.getElementById('card-' + docId);
  if(!card) return;

  // Guardar nombres de filas ya marcadas antes de re-renderizar
  const doneNombres = {};
  card.querySelectorAll('.item-row.done .item-nombre').forEach(el => {
    const nombre = el.textContent;
    doneNombres[nombre] = (doneNombres[nombre] || 0) + 1;
  });

  const items = data.items || [];
  const filas = [];
  items.forEach(it => {
    for(let u = 0; u < (it.cantidad || 1); u++) {
      filas.push({ nombre: it.nombre });
    }
  });
  const total = filas.length;
  const itemsHtml = filas.map((fila, idx) => `
    <div class="item-row" id="item-${docId}-${idx}" onclick="toggleItem('${docId}', ${idx}, ${total})">
      <div class="item-cant">1</div>
      <div class="item-nombre">${fila.nombre}</div>
      <div class="item-check"></div>
    </div>`).join('');

  const listEl = card.querySelector('.items-list');
  if(listEl) listEl.innerHTML = itemsHtml;

  // Restaurar estado done por nombre
  const pendingRestore = {...doneNombres};
  for(let i = 0; i < total; i++) {
    const row = document.getElementById(`item-${docId}-${i}`);
    if(!row) continue;
    const nombre = row.querySelector('.item-nombre').textContent;
    if(pendingRestore[nombre] && pendingRestore[nombre] > 0) {
      row.classList.add('done');
      row.querySelector('.item-check').textContent = '✓';
      pendingRestore[nombre]--;
    }
  }

  // Actualizar botón despachar según cuántos quedaron marcados
  let done = 0;
  for(let i = 0; i < total; i++) {
    const r = document.getElementById(`item-${docId}-${i}`);
    if(r && r.classList.contains('done')) done++;
  }
  const btn = document.getElementById(`btn-desp-${docId}`);
  if(btn) {
    if(done === total) {
      btn.classList.add('listo');
      btn.textContent = '✅ Todo listo — Despachar';
    } else if(done > 0) {
      btn.classList.remove('listo');
      btn.textContent = `${done}/${total} listos — Despachar`;
    } else {
      btn.classList.remove('listo');
      btn.textContent = 'Marcar ítems para despachar';
    }
  }

  showToast('🔄 Pedido mesa ' + (data.mesa || '') + ' actualizado');
}

function toggleItem(docId, idx, total) {
  const row = document.getElementById(`item-${docId}-${idx}`);
  if(!row) return;
  row.classList.toggle('done');
  // Actualizar check icon
  const check = row.querySelector('.item-check');
  check.textContent = row.classList.contains('done') ? '✓' : '';
  // Contar cuántos están listos
  let done = 0;
  for(let i = 0; i < total; i++) {
    const r = document.getElementById(`item-${docId}-${i}`);
    if(r && r.classList.contains('done')) done++;
  }
  const btn = document.getElementById(`btn-desp-${docId}`);
  if(!btn) return;
  if(done === total) {
    btn.classList.add('listo');
    btn.textContent = '✅ Todo listo — Despachar';
  } else if(done > 0) {
    btn.classList.remove('listo');
    btn.textContent = `${done}/${total} listos — Despachar`;
  } else {
    btn.classList.remove('listo');
    btn.textContent = 'Marcar ítems para despachar';
  }
}

// ── Barra de tiempo (verde → amarillo → rojo en 15 min) ──
function initTimerBar(docId, creadoAt) {
  const YELLOW_MS = 8 * 60 * 1000;
  const RED_MS    = 16 * 60 * 1000;
  function update() {
    const bar = document.getElementById('bar-' + docId);
    if(!bar) return;
    const elapsed = Date.now() - creadoAt.getTime();
    const pct = Math.min(100, elapsed / RED_MS * 100);
    bar.style.width = pct + '%';
    bar.style.background = elapsed < YELLOW_MS ? '#00b894' : elapsed < RED_MS ? '#fdcb6e' : '#e94560';
  }
  update();
  const iv = setInterval(() => {
    if(!document.getElementById('bar-' + docId)) { clearInterval(iv); return; }
    update();
  }, 5000);
}

// ── Swipe gesture (móvil) ──
function initSwipe(card, docId) {
  let startX = 0, startY = 0, dragging = false;
  card.addEventListener('touchstart', e => {
    startX = e.touches[0].clientX; startY = e.touches[0].clientY; dragging = false;
  }, { passive: true });
  card.addEventListener('touchmove', e => {
    const dx = e.touches[0].clientX - startX;
    const dy = e.touches[0].clientY - startY;
    if(!dragging && Math.abs(dy) > Math.abs(dx)) return;
    dragging = true;
    if(dx > 0) {
      card.classList.add('swiping');
      card.style.transform = `translateX(${dx}px)`;
      card.style.opacity = Math.max(0.2, 1 - dx / 180);
    }
  }, { passive: true });
  card.addEventListener('touchend', e => {
    if(!dragging) return;
    const dx = e.changedTouches[0].clientX - startX;
    card.classList.remove('swiping');
    card.style.transform = '';
    card.style.opacity = '';
    if(dx > 100) despachar(docId);
  }, { passive: true });
}

// ══════════════════════════════════════
//   DESPACHAR
// ══════════════════════════════════════
async function despachar(docId) {
  const card = document.getElementById('card-' + docId);
  if(!card) return;
  card.classList.add('dispatching');
  try {
    await db.collection('pedidos_cocina').doc(docId).update({
      estado: 'despachado',
      despachadoAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    showToast('✅ Pedido despachado');
  } catch(e) {
    card.classList.remove('dispatching');
    alert('Error: ' + e.message);
  }
}

// ══════════════════════════════════════
//   TOAST
// ══════════════════════════════════════
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
